<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Larana Bakery - Premium cakes, cookies and cupcakes made with love."
  >

  <title>Larana Bakery | Cakes, Cookies & Cupcakes</title>

  <style>
    @import url(
      "https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap"
    );

    :root {
      --cream: #fbf5ec;
      --cream-dark: #efe0cd;
      --white: #ffffff;
      --brown: #6c3f2c;
      --brown-dark: #3c2118;
      --brown-light: #9b6b52;
      --gold: #c99861;
      --text: #44291f;
      --muted: #80675c;

      --glass:
        rgba(255, 255, 255, 0.58);

      --border:
        rgba(108, 63, 44, 0.12);

      --shadow:
        0 24px 60px rgba(67, 36, 24, 0.14);

      --shadow-small:
        0 12px 30px rgba(67, 36, 24, 0.10);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--text);
      font-family: "DM Sans", sans-serif;

      background:
        radial-gradient(
          circle at 10% 10%,
          rgba(201, 152, 97, 0.17),
          transparent 25%
        ),
        radial-gradient(
          circle at 95% 75%,
          rgba(108, 63, 44, 0.11),
          transparent 25%
        ),
        linear-gradient(
          180deg,
          #fffaf4 0%,
          var(--cream) 50%,
          #f8eee2 100%
        );
    }

    body.menu-open {
      overflow: hidden;
    }

    img {
      display: block;
      width: 100%;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      font: inherit;
    }

    .container {
      width: min(1120px, 92%);
      margin-inline: auto;
    }

    .background-decoration {
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      overflow: hidden;
    }

    .background-decoration span {
      position: absolute;
      display: block;
      border-radius: 50%;
      filter: blur(5px);
      animation: backgroundFloat 8s ease-in-out infinite alternate;
    }

    .background-decoration span:nth-child(1) {
      width: 180px;
      height: 180px;
      top: 90px;
      left: -70px;
      background: rgba(201, 152, 97, 0.18);
    }

    .background-decoration span:nth-child(2) {
      width: 230px;
      height: 230px;
      right: -90px;
      top: 40%;
      background: rgba(108, 63, 44, 0.10);
      animation-delay: 1.5s;
    }

    .background-decoration span:nth-child(3) {
      width: 130px;
      height: 130px;
      left: 45%;
      bottom: 70px;
      background: rgba(255, 255, 255, 0.55);
      animation-delay: 2.5s;
    }

    @keyframes backgroundFloat {
      from {
        transform: translate3d(0, 0, 0);
      }

      to {
        transform: translate3d(18px, -24px, 0);
      }
    }

    header {
      position: sticky;
      top: 0;
      z-index: 1000;

      background:
        rgba(255, 250, 244, 0.80);

      border-bottom:
        1px solid var(--border);

      backdrop-filter:
        blur(18px);

      -webkit-backdrop-filter:
        blur(18px);
    }

    .navbar {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .logo-area img {
      width: 52px;
      height: 52px;
      flex-shrink: 0;
      object-fit: contain;
      padding: 4px;

      border-radius: 16px;
      background: var(--white);
      box-shadow: var(--shadow-small);
    }

    .logo-text {
      min-width: 0;
    }

    .logo-text h1 {
      color: var(--brown-dark);
      font-family: "Playfair Display", serif;
      font-size: 1.15rem;
      line-height: 1.1;
      letter-spacing: 0.7px;
    }

    .logo-text p {
      margin-top: 3px;
      color: var(--muted);
      font-size: 0.75rem;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .nav-links a {
      position: relative;
      color: var(--text);
      font-size: 0.94rem;
      font-weight: 600;
      transition: color 0.25s ease;
    }

    .nav-links a:not(.nav-order)::after {
      position: absolute;
      content: "";
      width: 0;
      height: 2px;
      left: 0;
      bottom: -6px;

      background: var(--brown);
      transition: width 0.25s ease;
    }

    .nav-links a:hover {
      color: var(--brown);
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    .nav-order {
      padding: 11px 18px;
      border-radius: 999px;
      color: var(--white) !important;

      background:
        linear-gradient(
          135deg,
          var(--brown),
          #895740
        );

      box-shadow:
        0 12px 24px rgba(108, 63, 44, 0.22);

      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease;
    }

    .nav-order:hover {
      transform: translateY(-2px);
      box-shadow:
        0 16px 30px rgba(108, 63, 44, 0.28);
    }

    .menu-button {
      display: none;
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      cursor: pointer;

      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--brown-dark);
      background: rgba(255, 255, 255, 0.65);
    }

    .menu-button span {
      display: block;
      width: 19px;
      height: 2px;
      margin: 4px auto;
      border-radius: 20px;
      background: currentColor;
      transition: 0.25s ease;
    }

    .menu-button.active span:nth-child(1) {
      transform: translateY(6px) rotate(45deg);
    }

    .menu-button.active span:nth-child(2) {
      opacity: 0;
    }

    .menu-button.active span:nth-child(3) {
      transform: translateY(-6px) rotate(-45deg);
    }

    .hero {
      position: relative;
      padding: 78px 0 55px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns:
        minmax(0, 1.05fr)
        minmax(310px, 0.95fr);

      align-items: center;
      gap: 56px;
    }

    .hero-content {
      animation:
        revealUp 0.85s ease both;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      margin-bottom: 20px;
      padding: 10px 16px;

      color: var(--brown);
      font-size: 0.84rem;
      font-weight: 700;

      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.66);
      box-shadow: var(--shadow-small);
    }

    .eyebrow::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow:
        0 0 0 5px rgba(201, 152, 97, 0.14);
    }

    .hero h2 {
      max-width: 700px;
      margin-bottom: 20px;

      color: var(--brown-dark);
      font-family: "Playfair Display", serif;
      font-size: clamp(2.6rem, 6vw, 5.5rem);
      line-height: 0.98;
      letter-spacing: -2px;
    }

    .hero h2 em {
      color: var(--brown);
      font-weight: 600;
    }

    .hero-description {
      max-width: 610px;
      margin-bottom: 30px;

      color: var(--muted);
      font-size: 1.04rem;
      line-height: 1.8;
    }

    .hero-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    .button {
      min-height: 50px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;

      padding: 13px 23px;
      border-radius: 999px;

      font-size: 0.94rem;
      font-weight: 700;

      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        background 0.25s ease;
    }

    .button-primary {
      color: var(--white);

      background:
        linear-gradient(
          135deg,
          var(--brown),
          #8c5a43
        );

      box-shadow:
        0 14px 28px rgba(108, 63, 44, 0.24);
    }

    .button-primary:hover {
      transform: translateY(-3px);
      box-shadow:
        0 18px 34px rgba(108, 63, 44, 0.30);
    }

    .button-secondary {
      color: var(--brown);
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.68);
      box-shadow: var(--shadow-small);
    }

    .button-secondary:hover {
      transform: translateY(-3px);
      background: var(--white);
    }

    .button-icon {
      font-size: 1.05rem;
    }

    .three-d-wrapper {
      perspective: 1300px;
    }

    .three-d-card {
      position: relative;
      overflow: hidden;
      isolation: isolate;
      transform-style: preserve-3d;

      border: 1px solid rgba(108, 63, 44, 0.10);
      border-radius: 30px;

      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.78),
          rgba(255, 255, 255, 0.37)
        );

      box-shadow: var(--shadow);

      transition:
        transform 0.18s ease-out,
        box-shadow 0.25s ease;
    }

    .three-d-card::before {
      position: absolute;
      content: "";
      inset: 0;
      z-index: 1;
      pointer-events: none;

      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.47),
          transparent 45%
        );
    }

    .hero-visual {
      max-width: 490px;
      margin-left: auto;
      padding: 17px;
      animation:
        revealUp 0.95s 0.12s ease both;
    }

    .hero-visual::after {
      position: absolute;
      content: "";
      width: 180px;
      height: 180px;
      right: -50px;
      top: -50px;
      z-index: 0;

      border-radius: 50%;
      border: 2px solid rgba(201, 152, 97, 0.34);
    }

    .hero-picture {
      position: relative;
      z-index: 2;
      overflow: hidden;
      transform: translateZ(45px);

      border-radius: 24px;
    }

    .hero-picture img {
      aspect-ratio: 4 / 5;
      object-fit: cover;
    }

    .hero-picture::after {
      position: absolute;
      content: "";
      inset: 0;
      pointer-events: none;

      background:
        linear-gradient(
          to top,
          rgba(44, 24, 17, 0.25),
          transparent 40%
        );
    }

    .floating-label {
      position: absolute;
      left: 31px;
      right: 31px;
      bottom: 32px;
      z-index: 4;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;

      padding: 14px 16px;
      transform: translateZ(70px);

      border: 1px solid rgba(255, 255, 255, 0.36);
      border-radius: 17px;

      background:
        rgba(255, 255, 255, 0.84);

      box-shadow:
        0 14px 28px rgba(53, 28, 19, 0.18);

      backdrop-filter: blur(14px);
    }

    .floating-label strong {
      display: block;
      color: var(--brown-dark);
      font-family: "Playfair Display", serif;
      font-size: 1rem;
    }

    .floating-label small {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 0.73rem;
    }

    .floating-label span {
      flex-shrink: 0;
      padding: 8px 12px;
      color: var(--brown);
      font-size: 0.75rem;
      font-weight: 700;

      border-radius: 999px;
      background: rgba(201, 152, 97, 0.18);
    }

    @keyframes revealUp {
      from {
        opacity: 0;
        transform: translateY(28px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    section {
      scroll-margin-top: 90px;
    }

    .products-section {
      padding: 70px 0;
    }

    .section-heading {
      max-width: 700px;
      margin: 0 auto 38px;
      text-align: center;
    }

    .section-heading span {
      display: block;
      margin-bottom: 9px;
      color: var(--gold);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .section-heading h3 {
      margin-bottom: 13px;
      color: var(--brown-dark);
      font-family: "Playfair Display", serif;
      font-size: clamp(2rem, 5vw, 3.5rem);
      line-height: 1.05;
    }

    .section-heading p {
      color: var(--muted);
      line-height: 1.75;
    }

    .product-grid {
      display: grid;
      grid-template-columns:
        repeat(3, minmax(0, 1fr));

      gap: 24px;
    }

    .product-card {
      height: 100%;
      padding: 14px;
    }

    .product-image {
      position: relative;
      z-index: 2;
      overflow: hidden;
      transform: translateZ(38px);

      border-radius: 23px;
    }

    .product-image img {
      aspect-ratio: 4 / 5;
      object-fit: cover;

      transition:
        transform 0.55s ease;
    }

    .product-card:hover .product-image img {
      transform: scale(1.055);
    }

    .product-content {
      position: relative;
      z-index: 3;
      padding: 19px 6px 8px;
      transform: translateZ(52px);
    }

    .product-number {
      display: inline-block;
      margin-bottom: 10px;
      color: var(--gold);
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 1.5px;
    }

    .product-content h4 {
      margin-bottom: 9px;
      color: var(--brown-dark);
      font-family: "Playfair Display", serif;
      font-size: 1.35rem;
    }

    .product-content p {
      min-height: 78px;
      margin-bottom: 17px;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.65;
    }

    .product-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .product-type {
      color: var(--brown);
      font-size: 0.82rem;
      font-weight: 700;
    }

    .small-order-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      padding: 10px 15px;
      color: var(--brown);
      font-size: 0.82rem;
      font-weight: 700;

      border: 1px solid rgba(108, 63, 44, 0.11);
      border-radius: 999px;
      background: rgba(108, 63, 44, 0.08);

      transition:
        background 0.25s ease,
        color 0.25s ease,
        transform 0.25s ease;
    }

    .small-order-button:hover {
      color: var(--white);
      background: var(--brown);
      transform: translateY(-2px);
    }

    .about-section {
      padding: 55px 0 75px;
    }

    .about-box {
      position: relative;
      overflow: hidden;

      display: grid;
      grid-template-columns:
        minmax(0, 1.1fr)
        minmax(280px, 0.9fr);

      gap: 40px;
      align-items: center;

      padding: 45px;

      border: 1px solid var(--border);
      border-radius: 34px;

      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.72),
          rgba(255, 255, 255, 0.39)
        );

      box-shadow: var(--shadow);
    }

    .about-box::before {
      position: absolute;
      content: "";
      width: 250px;
      height: 250px;
      right: -100px;
      bottom: -110px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(201, 152, 97, 0.22),
          transparent 67%
        );
    }

    .about-content,
    .about-points {
      position: relative;
      z-index: 2;
    }

    .about-content span {
      display: block;
      margin-bottom: 10px;
      color: var(--gold);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .about-content h3 {
      margin-bottom: 17px;
      color: var(--brown-dark);
      font-family: "Playfair Display", serif;
      font-size: clamp(2rem, 4vw, 3.2rem);
      line-height: 1.08;
    }

    .about-content p {
      color: var(--muted);
      line-height: 1.8;
    }

    .about-points {
      display: grid;
      gap: 13px;
    }

    .about-point {
      display: flex;
      align-items: center;
      gap: 12px;

      padding: 15px 17px;

      border: 1px solid rgba(108, 63, 44, 0.09);
      border-radius: 18px;

      color: var(--brown);
      background: rgba(255, 255, 255, 0.62);

      box-shadow:
        0 9px 20px rgba(67, 36, 24, 0.06);
    }

    .about-point span {
      width: 31px;
      height: 31px;
      flex-shrink: 0;

      display: grid;
      place-items: center;

      color: var(--white);
      border-radius: 50%;
      background: var(--brown);
    }

    .about-point strong {
      display: block;
      color: var(--brown-dark);
      font-size: 0.91rem;
    }

    .about-point small {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 0.75rem;
    }

    .contact-section {
      padding: 20px 0 80px;
    }

    .contact-box {
      overflow: hidden;
      display: grid;
      grid-template-columns:
        minmax(0, 1fr)
        minmax(300px, 0.85fr);

      gap: 40px;

      padding: 44px;

      color: var(--white);
      border-radius: 34px;

      background:
        linear-gradient(
          135deg,
          #42251b,
          #6f402d
        );

      box-shadow:
        0 28px 65px rgba(57, 29, 20, 0.24);
    }

    .contact-content h3 {
      margin-bottom: 15px;
      font-family: "Playfair Display", serif;
      font-size: clamp(2rem, 5vw, 3.4rem);
      line-height: 1.06;
    }

    .contact-content p {
      max-width: 560px;
      color: rgba(255, 255, 255, 0.76);
      line-height: 1.75;
    }

    .contact-details {
      display: grid;
      gap: 13px;
      margin-top: 25px;
    }

    .contact-detail {
      display: flex;
      align-items: center;
      gap: 12px;
      color: rgba(255, 255, 255, 0.92);
    }

    .contact-detail span {
      width: 37px;
      height: 37px;
      flex-shrink: 0;

      display: grid;
      place-items: center;

      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
    }

    .order-panel {
      align-self: center;
      padding: 26px;

      border: 1px solid rgba(255, 255, 255, 0.17);
      border-radius: 25px;

      background:
        rgba(255, 255, 255, 0.10);

      backdrop-filter: blur(12px);
    }

    .order-panel h4 {
      margin-bottom: 9px;
      font-family: "Playfair Display", serif;
      font-size: 1.5rem;
    }

    .order-panel p {
      margin-bottom: 20px;
      color: rgba(255, 255, 255, 0.73);
      font-size: 0.9rem;
      line-height: 1.65;
    }

    .whatsapp-button {
      width: 100%;
      min-height: 52px;

      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;

      padding: 13px 18px;

      color: var(--brown-dark);
      font-weight: 800;

      border-radius: 999px;
      background: var(--cream);

      box-shadow:
        0 13px 27px rgba(0, 0, 0, 0.17);

      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease;
    }

    .whatsapp-button:hover {
      transform: translateY(-3px);
      box-shadow:
        0 17px 34px rgba(0, 0, 0, 0.22);
    }

    footer {
      padding: 30px 0 40px;
      text-align: center;
    }

    .footer-logo {
      width: 62px;
      height: 62px;
      margin: 0 auto 12px;
      object-fit: contain;
      padding: 5px;

      border-radius: 17px;
      background: var(--white);
      box-shadow: var(--shadow-small);
    }

    footer h4 {
      margin-bottom: 6px;
      color: var(--brown-dark);
      font-family: "Playfair Display", serif;
      font-size: 1.15rem;
    }

    .copyright {
      color: var(--muted);
      font-size: 0.84rem;
    }

    .creator-credit {
      margin-top: 16px;
      padding-top: 16px;

      color: var(--muted);
      font-size: 0.88rem;

      border-top:
        1px solid rgba(108, 63, 44, 0.10);
    }

    .creator-credit strong {
      display: block;
      margin-top: 5px;

      color: var(--brown-dark);
      font-size: 0.96rem;
      letter-spacing: 0.7px;
    }

    .reveal {
      opacity: 0;
      transform: translateY(28px);

      trans
